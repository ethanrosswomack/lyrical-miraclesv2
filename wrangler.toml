name = "lyrical-vector-ingest"
main = "platform/vectorize-worker/src/index.ts"
compatibility_date = "2026-05-25"

[assets]
directory = "content/*"
binding = "ASSETS"

[[d1_databases]]
binding = "LYRICAL_DB"
database_name = "lyrical-miracles"

[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "lyrical-miracles"
remote = true

[env.production]
workers_dev = true

[[env.production.d1_databases]]
binding = "LYRICAL_DB"
database_name = "lyrical-miracles"

[[env.production.vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "lyrical-miracles"
remote = true
